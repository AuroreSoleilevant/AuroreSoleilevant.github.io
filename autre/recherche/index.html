<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recherche | Spica</title>
  <!-- 调用列表 -->
  <script src="/js/common-head.js" fetchpriority="high"></script>
  <script src="/js/list.js"></script>
  <link rel="stylesheet" href="/css/morceau.css">
  <link rel="stylesheet" href="/css/search.css">
  <script src="/js/search.js" defer></script>
</head>

<body class="no-comments">

  <!-- 顶栏，需带着 -->
  <div id="header-placeholder"></div>

  <!-- 主体内容 -->
<main class="main-content" role="main">
  <!-- 大标题 -->
  <h1 class="shaking-text">
  搜索
  </h1>

<div class="search-container">
        <form class="search-box" id="searchForm" role="search">
            <input type="search" class="search-input" id="searchInput" required autocomplete="off" aria-label="搜索文章与故事" aria-describedby="searchInstructions searchStatus">
            <button class="search-button" id="searchButton" type="submit" aria-label="搜索">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </button>
        </form>
        <p class="instructions" id="searchInstructions">输入关键词后点击搜索或按回车键</p>
        <p class="search-status" id="searchStatus" aria-live="polite"></p>
    </div>


  <div id="mt-list" class="home-center"></div>
  </main>

  <!-- 左下角日期 -->
  <div class="page-dates">
  发布：19/10/2025　修改：30/07/2026
  </div>

  <!-- 底栏，需带着 -->
  <div id="footer-placeholder"></div>

</body>
</html>
